<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Güvenli Web Sitesi - Oturum Koruması (JWT)</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; line-height: 1.6; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    .card { flex: 1; min-width: 300px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
    input, button { width: 100%; padding: 10px; margin-top: 8px; font-size: 14px; box-sizing: border-box; }
    button { background: #0066cc; color: #fff; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background: #0052a3; }
    .btn-danger { background: #cc0000; }
    .btn-danger:hover { background: #990000; }
    .log-box { margin-top: 15px; padding: 10px; background: #222; color: #00ff00; font-family: monospace; font-size: 12px; border-radius: 4px; min-height: 80px; overflow-y: auto; word-break: break-all; }
    .error { color: #ff4d4d; }
    .success { color: #00ff00; }
  </style>
</head>
<body>
  <h2>Oturum Güvenliği (JWT / Token Simülasyonu)</h2>

  <div class="container">
    <!-- SOL: Giriş Yap ve Token Al -->
    <div class="card">
      <h3>1. Giriş Yap & Token Oluştur</h3>
      <form id="authForm">
        <input type="text" id="authUser" placeholder="Kullanıcı Adı" autocomplete="off" required>
        <input type="password" id="authPass" placeholder="Şifre" required>
        <button type="submit">Giriş Yap & Bilet (Token) Al</button>
      </form>
      <button id="logoutBtn" class="btn-danger" style="margin-top: 10px; display: none;">Oturumu Kapat (Token'ı Sil)</button>
      <div id="authLog" class="log-box">Oturum açılmadı.</div>
    </div>

    <!-- SAĞ: Korumalı Sayfa / İşlem Denemesi -->
    <div class="card">
      <h3>2. Korumalı Alana Erişim</h3>
      <p><small>Sadece geçerli bir Token (Bilet) sahibi olanlar girebilir.</small></p>
      <button id="accessSecretBtn">Gizli Verileri Getir</button>
      <div id="secretLog" class="log-box">Erişim bekleniyor...</div>
    </div>
  </div>

  <script>
    let activeToken = null;

    // Sahte JWT Token üretici
    function generateFakeJWT(username) {
      const header = btoa(JSON.stringify({ alg: "HS256", typ: "JWT" }));
      const payload = btoa(JSON.stringify({ user: username, role: "admin", exp: Date.now() + 60000 }));
      const signature = btoa("secret_key_12345");
      return `${header}.${payload}.${signature}`;
    }

    // Giriş işlemi
    document.getElementById('authForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('authUser').value;
      const pass = document.getElementById('authPass').value;
      const authLog = document.getElementById('authLog');
      const logoutBtn = document.getElementById('logoutBtn');

      if (pass.length < 4) {
        authLog.innerHTML = `<span class="error">[HATA] Şifre çok kısa!</span>`;
        return;
      }

      // Başarılı giriş sonucu Token üretilir ve saklanır
      activeToken = generateFakeJWT(user);
      authLog.innerHTML = `<span class="success">[BAŞARILI] Giriş yapıldı!<br><b>Token:</b><br>${activeToken}</span>`;
      logoutBtn.style.display = "block";
    });

    // Oturumu Kapatma
    document.getElementById('logoutBtn').addEventListener('click', function() {
      activeToken = null;
      document.getElementById('authLog').innerHTML = "Oturum kapatıldı. Token silindi.";
      document.getElementById('secretLog').innerHTML = "Erişim bekleniyor...";
      this.style.display = "none";
    });

    // Korumalı Alana İstek Atma
    document.getElementById('accessSecretBtn').addEventListener('click', function() {
      const secretLog = document.getElementById('secretLog');

      if (!activeToken) {
        secretLog.innerHTML = `<span class="error">[REDDEDİLDİ 401] Yetkisiz Erişim! Geçerli bir Oturum Token'ınız yok. Lütfen önce giriş yapın.</span>`;
      } else {
        secretLog.innerHTML = `<span class="success">[ERİŞİM SAĞLANDI 200]<br>Token doğrulandı! VIP veriler yüklendi:<br>- Gizli Rapor: %100 Güvenli Sistem</span>`;
      }
    });
  </script>
</body>
</html>
