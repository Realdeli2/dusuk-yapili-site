<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Güvenlik Başlıkları (XSS Koruması) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  
  <title>Güvenli Web Sitesi</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    input, button { padding: 10px; margin-top: 10px; font-size: 16px; }
    #output { margin-top: 20px; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; }
  </style>
</head>
<body>
  <h1>Güvenli Mesaj Alanı</h1>
  <p>Aşağıya bir mesaj yazın. Sistem girdiyi güvenli hale getirerek ekrana basacaktır.</p>

  <form id="messageForm">
    <input type="text" id="userInput" placeholder="Mesajınızı yazın..." required style="width: 70%;">
    <button type="submit">Gönder</button>
  </form>

  <h3>Gelen Mesaj:</h3>
  <div id="output">Henüz mesaj yok.</div>

  <script>
    document.getElementById('messageForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const input = document.getElementById('userInput').value;
      const outputDiv = document.getElementById('output');
      
      // GÜVENLİ YÖNTEM: innerHTML yerine textContent kullanımı.
      // Bu sayede girilen kodlar çalıştırılmaz, sadece düz metin olarak basılır.
      outputDiv.textContent = input;
      
      document.getElementById('userInput').value = '';
    });
  </script>
</body>
</html>
