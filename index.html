<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Güvenli Web Sitesi - Yetki Kontrolü (RBAC)</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; line-height: 1.6; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    .card { flex: 1; min-width: 300px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
    input, select, button { width: 100%; padding: 10px; margin-top: 8px; font-size: 14px; box-sizing: border-box; }
    button { background: #0066cc; color: #fff; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background: #0052a3; }
    .btn-danger { background: #cc0000; }
    .btn-danger:hover { background: #990000; }
    .log-box { margin-top: 15px; padding: 10px; background: #222; color: #00ff00; font-family: monospace; font-size: 12px; border-radius: 4px; min-height: 90px; overflow-y: auto; word-break: break-all; }
    .error { color: #ff4d4d; }
    .success { color: #00ff00; }
    .badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    .badge-user { background: #e0e0e0; color: #333; }
    .badge-admin { background: #ffcc00; color: #000; }
  </style>
</head>
<body>
  <h2>Giriş Sonrası Güvenlik: Yetki Kontrolü (RBAC)</h2>

  <div class="container">
    <!-- SOL: Giriş ve Rol Seçimi -->
    <div class="card">
      <h3>1. Hesaba Giriş Yap</h3>
      <form id="rbacForm">
        <input type="text" id="rbacUser" placeholder="Kullanıcı Adı" autocomplete="off" required>
        <select id="rbacRole">
          <option value="USER">Sıradan Kullanıcı (Rol: USER)</option>
          <option value="ADMIN">Yönetici (Rol: ADMIN)</option>
        </select>
        <button type="submit">Giriş Yap</button>
      </form>
      <button id="rbacLogout" class="btn-danger" style="margin-top: 10px; display: none;">Çıkış Yap</button>
      <div id="userLog" class="log-box">Henüz giriş yapılmadı.</div>
    </div>

    <!-- SAĞ: Admin Paneli ve Yetki Sınama -->
    <div class="card">
      <h3>2. Korumalı Admin Paneli</h3>
      <p><small>Sadece <b>ADMIN</b> rolüne sahip kullanıcılar işlem yapabilir.</small></p>
      <button id="adminActionBtn">Kullanıcıyı Sil (Admin Yetkisi İster)</button>
      <div id="adminLog" class="log-box">Yetki denetimi bekleniyor...</div>
    </div>
  </div>

  <script>
    let currentSession = null;

    // Giriş İşlemi
    document.getElementById('rbacForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('rbacUser').value;
      const role = document.getElementById('rbacRole').value;
      const userLog = document.getElementById('userLog');
      const logoutBtn = document.getElementById('rbacLogout');

      // Oturum verisi (Sunucu tarafındaki Token doğrulaması simülasyonu)
      currentSession = { username: user, role: role };

      const badgeClass = role === 'ADMIN' ? 'badge-admin' : 'badge-user';
      userLog.innerHTML = `<span class="success">[GİRİŞ BAŞARILI]</span><br>Kullanıcı: <b>${user}</b><br>Atanan Rol: <span class="badge ${badgeClass}">${role}</span>`;
      logoutBtn.style.display = "block";
    });

    // Çıkış İşlemi
    document.getElementById('rbacLogout').addEventListener('click', function() {
      currentSession = null;
      document.getElementById('userLog').innerHTML = "Oturum kapatıldı.";
      document.getElementById('adminLog').innerHTML = "Yetki denetimi bekleniyor...";
      this.style.display = "none";
    });

    // Admin Yetkisi Gerektiren Buton Denemesi (IDOR / Yetki Aşımı Testi)
    document.getElementById('adminActionBtn').addEventListener('click', function() {
      const adminLog = document.getElementById('adminLog');

      // 1. Durum: Hiç giriş yapılmamış
      if (!currentSession) {
        adminLog.innerHTML = `<span class="error">[REDDEDİLDİ 401] Oturum açılmadı! Önce giriş yapmalısınız.</span>`;
        return;
      }

      // 2. Durum: Giriş yapılmış ama Yetki (Rol) yetersiz
      if (currentSession.role !== 'ADMIN') {
        adminLog.innerHTML = `<span class="error">[ERİŞİM ENGELENDİ 403] Yetkisiz İşlem!<br>Kullanıcı: '${currentSession.username}' (Rol: ${currentSession.role})<br>Hata: Bu işlem için 'ADMIN' yetkisi gereklidir! Yetki yükseltme engellendi.</span>`;
        return;
      }

      // 3. Durum: Giriş yapılmış VE Admin yetkisi var
      adminLog.innerHTML = `<span class="success">[İŞLEM BAŞARILI 200]<br>Kullanıcı: '${currentSession.username}' (Rol: ADMIN)<br>Eylem: Admin yetkisi doğrulandı. Kritik işlem başarıyla gerçekleştirildi.</span>`;
    });
  </script>
 
<script src="security-tests.js"></script>
</body>
</html>
